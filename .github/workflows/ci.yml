name: CI

# 検証だけを行う。公開・配布・ストアへの送信は一切しない。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 構文検査
        run: |
          node --check src/matcher.js
          node --check src/content.js
      - name: 用語判定のテスト
        run: node --test "tests/**/*.test.js"
      - name: 構成と文書の整合
        run: node scripts/verify.mjs

  e2e:
    # 拡張として実際に読み込んで動かす。Chrome と openssl が要る。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Chrome の場所を確認
        run: which google-chrome || which google-chrome-stable || which chromium-browser
      - name: 拡張として読み込んでのテスト
        run: node --test tests/e2e/extension.e2e.mjs
