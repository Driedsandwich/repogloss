name: CI

# 検証だけを行う。公開・配布・ストアへの送信は一切しない。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 構文検査
        run: |
          node --check src/matcher.js
          node --check src/content.js
      - name: 用語判定のテスト
        run: node --test "tests/**/*.test.js"
      - name: 構成と文書の整合
        run: node scripts/verify.mjs

  e2e:
    # 拡張として実際に読み込んで動かす。Chrome と openssl が要る。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Chrome の場所を確認
        run: which google-chrome || which google-chrome-stable || which chromium-browser
      - name: 拡張として読み込んでのテスト
        run: node --test tests/e2e/extension.e2e.mjs

  # 配布物が OS をまたいで同じになるかを測る。改行が揺れると合算ハッシュが変わる。
  package-hash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 判定と構成の検査
        run: npm test
      - name: 配布物を並べて合算ハッシュを出す
        run: npm run package:stage

  # Windows の実機に近い環境で、拡張として読み込めるかを試す。
  # CDP のパイプ方式が Windows で通るかは未知のため、落ちても CI 全体は止めない
  # （結果は記録し、通らなければ別途対応する）。
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Chrome の場所
        run: |
          if (Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe") { echo "found" } else { echo "not found" }
        shell: pwsh
      - name: 拡張として読み込んでのテスト（試行）
        continue-on-error: true
        run: npm run test:e2e
